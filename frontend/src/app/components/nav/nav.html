<nav class="nav">
  <a class="nav__brand" routerLink="/">~/portfolio</a>
  <div class="nav__links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">~/home</a>
    <a routerLink="/experience" routerLinkActive="active">~/experience</a>
    <a routerLink="/repos" routerLinkActive="active">~/repos</a>
    <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg *ngIf="!isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg *ngIf="isDark()" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
      </svg>
    </button>
  </div>
</nav>
